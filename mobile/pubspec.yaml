name: rehearsal_app
description: "Rehearsal — AI-Assisted Mock Interview & Speech Analytics Platform"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & Auth
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  google_sign_in: ^6.2.1
  
  # State Management
  provider: ^6.1.0
  
  # File Picking (for resume PDF upload)
  file_picker: ^8.0.0
  
  # Camera & Recording & Speech
  permission_handler: ^11.3.0
  camera: ^0.11.0
  video_player: ^2.8.0
  speech_to_text: ^7.4.0
  
  # UI / Design
  google_fonts: ^6.2.0
  flutter_animate: ^4.5.0
  
  # Utilities
  path_provider: ^2.1.0
  mime: ^2.0.0
  intl: ^0.20.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"

flutter:
  uses-material-design: true
