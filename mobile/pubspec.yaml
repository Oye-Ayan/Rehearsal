name: rehearsal_app
description: "Rehearsal — AI-Assisted Mock Interview & Speech Analytics Platform"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & Auth
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  
  # State Management
  provider: ^6.1.0
  
  # File Picking (for resume PDF upload)
  file_picker: ^8.0.0
  
  # Camera & Recording & Speech
  camera: ^0.11.0
  video_player: ^2.8.0
  speech_to_text: ^7.4.0
  
  # UI / Design
  google_fonts: ^6.2.0
  flutter_animate: ^4.5.0
  
  # Utilities
  path_provider: ^2.1.0
  mime: ^2.0.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
