spring.application.name=rehearsal-api

# MySQL Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rehearsal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:0987}

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Import optional local secret file (ignored by git)
spring.config.import=optional:file:./src/main/resources/application-secret.properties,optional:classpath:application-secret.properties

# Server Port (Render and cloud hosts inject PORT)
server.port=${PORT:8080}

# Groq LLM API Configuration
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY:your_groq_api_key_here}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from.name=Rehearsal

# Password Reset Base URLs (Web browser portal & Mobile app deep link)
app.reset-password.web-url=${APP_RESET_PASSWORD_WEB_URL:http://10.10.20.121:8080/reset-password?token=}
app.reset-password.url-scheme=rehearsal://reset-password?token=

# Google OAuth Configuration
google.client.id=1061585873129-iaha8qt9n6lqqvsf2nph2ae9hr5b144c.apps.googleusercontent.com
